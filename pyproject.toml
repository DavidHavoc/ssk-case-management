[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ssk-case-management"
version = "0.1.0"
description = "Standalone case management for SSK centers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "factory-boy>=3.3,<4",
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "staticfiles", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
