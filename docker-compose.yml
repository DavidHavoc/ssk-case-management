services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ssk
      POSTGRES_USER: ssk
      POSTGRES_PASSWORD: ssk-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssk -d ssk"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - private_media:/app/media/private
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  private_media:
